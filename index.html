<!doctype html>
<meta charset="UTF-8">
<title>스케줄매니저</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스케줄매니저">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<style>
@font-face{font-family:'Pretendard Variable';src:url('./PretendardVariable.woff2') format('woff2');font-weight:45 920;font-style:normal;font-display:swap}
:root{--font-sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
   --color-background-primary:#FFFFFF;
  --color-background-secondary:#F7F5F2;

  --color-text-primary:#111827;
  --color-text-secondary:#6B7280;

  --color-border-secondary:#E5E7EB;
  --color-border-tertiary:#E5E7EB;
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--color-background-secondary,#F7F5F2)}
body{font-family:var(--font-sans);color:var(--color-text-primary);font-size:15px;line-height:1.45;background:var(--color-background-secondary,#F7F5F2)}
.app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;padding:0 14px 80px;background:var(--color-background-primary,#fff)}

/* ── Bottom Tab Bar ── */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:64px;

  background:var(--color-background-primary,#FFFFFF);
  border-top:1px solid var(--color-border-tertiary,#E5E7EB);

  display:flex;
  z-index:100;
  max-width:480px;
  margin:0 auto;
}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:transparent;border:none;color:var(--color-text-secondary);font-size:10px;padding:6px 0;min-height:64px}
.bnav-btn:active{opacity:.6}
.bnav-btn.active{color:#C8844A}
.bnav-icon{font-size:22px;line-height:1}

/* ── Top store tabs (schedule view) ── */
.top-nav{display:flex;overflow-x:auto;gap:4px;padding:10px 0 0;border-bottom:1px solid var(--color-border-tertiary);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.top-nav::-webkit-scrollbar{display:none}
.tab-btn{flex:none;padding:10px 16px;font-size:14px;border:0.5px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;background:transparent;color:var(--color-text-secondary);white-space:nowrap;min-height:44px}
.tab-btn.active{background:var(--color-background-primary);border-color:var(--color-border-secondary);color:var(--color-text-primary);font-weight:500;position:relative;top:1px;border-bottom:1px solid var(--color-background-primary)}
.tab-btn:active{opacity:.7}

.sec-row{display:flex;gap:6px;padding:12px 0 10px;overflow-x:auto;scrollbar-width:none}
.sec-row::-webkit-scrollbar{display:none}
.sec-btn{flex:none;padding:8px 16px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:20px;cursor:pointer;background:transparent;color:var(--color-text-secondary);min-height:36px}
.sec-btn.active{background:#F5EDE3;border-color:#C8844A;color:#7D4A1A;font-weight:500}
.sec-btn:active{opacity:.7}


/* ── Excel & Image Download ── */
.dl-wrap{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-bottom:8px}
.btn-excel{display:flex;align-items:center;gap:4px;padding:6px 9px;font-size:11px;font-weight:600;border:1px solid #1D6F2B;border-radius:8px;cursor:pointer;background:#E8F5EA;color:#1D6F2B;min-height:30px}
.btn-excel:active{opacity:.7}
.btn-excel svg{width:13px;height:13px;flex-shrink:0}
.btn-imgdl{display:flex;align-items:center;gap:4px;padding:6px 9px;font-size:11px;font-weight:600;border:1px solid #185FA5;border-radius:8px;cursor:pointer;background:#E8F0FB;color:#185FA5;min-height:30px}
.btn-imgdl:active{opacity:.7}
.btn-imgdl svg{width:13px;height:13px;flex-shrink:0}

/* ── Home screen ── */
.home-wrap{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 80px)}
.home-logo-splash{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px 32px}
.home-logo-full{width:100%;max-width:340px;object-fit:contain}

.home-section-title{font-size:13px;font-weight:600;color:var(--color-text-secondary);margin-bottom:8px;padding-left:2px;text-transform:uppercase;letter-spacing:.5px}
.home-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:14px;margin-bottom:12px}
.home-store-name{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--color-text-primary)}
.home-today-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.home-shift-pill{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:500}
.home-shift-pill.open{background:#EAF3DE;color:#27500A}
.home-shift-pill.mid{background:#E1F5EE;color:#085041}
.home-shift-pill.close{background:#EEEDFE;color:#3C3489}
.home-shift-pill.off{background:#FAECE7;color:#712B13}
.home-shift-pill.annual{background:#FAEEDA;color:#633806}
.home-shift-pill.half{background:#F0E8F8;color:#5B2E91}
.home-no-sched{font-size:13px;color:var(--color-text-secondary)}
.home-sub-row{display:flex;gap:8px;margin-top:6px}
.home-mini-stat{flex:1;background:var(--color-background-secondary);border-radius:8px;padding:7px 8px;text-align:center}
.home-mini-stat .ms-val{font-size:16px;font-weight:600}
.home-mini-stat .ms-label{font-size:10px;color:var(--color-text-secondary);margin-top:1px}
.home-empty{text-align:center;color:var(--color-text-secondary);font-size:14px;padding:40px 0}

/* ── Calendar ── */
.cal-wrap{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;margin-bottom:12px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-header h3{font-size:14px;font-weight:500}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:36px;height:36px;font-size:18px;border:0.5px solid var(--color-border-secondary);border-radius:8px;cursor:pointer;background:transparent;color:var(--color-text-primary);display:flex;align-items:center;justify-content:center}
.cal-nav button:active{background:var(--color-background-secondary)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:11px;color:var(--color-text-secondary);text-align:center;padding:4px 0;font-weight:500}
.cal-day{min-height:60px;border:0.5px solid var(--color-border-tertiary);border-radius:4px;padding:4px 3px;cursor:pointer;background:var(--color-background-primary);position:relative}
.day-badges{display:flex;flex-direction:column;gap:2px}
.cal-day:active{background:var(--color-background-secondary)}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default}
.cal-day.today{border-color:#C8844A;background:#FDF4EC}
.day-num{font-size:11px;color:var(--color-text-secondary);margin-bottom:2px;padding-left:2px;display:flex;align-items:flex-start;gap:2px;flex-wrap:nowrap;line-height:1.3}
.day-num-digit{flex-shrink:0;font-size:11px;line-height:1.3}
.cal-day.today .day-num{color:#7D4A1A;font-weight:500}
.sun .day-num{color:#A32D2D!important}
.sat .day-num{color:#185FA5!important}
.holiday .day-num{color:#A32D2D!important}
.holiday-name{display:inline;font-size:8px;color:#A32D2D;font-weight:600;line-height:1.3;word-break:keep-all;overflow-wrap:break-word;min-width:0;flex:1}
.birthday-name{display:inline;font-size:8px;color:#9B59B6;font-weight:600;line-height:1.3;word-break:keep-all;overflow-wrap:break-word}
.day-num-extra{display:flex;flex-direction:column;gap:0;min-width:0;flex:1}
.dbadge{display:block;font-size:9px;padding:2px 3px;border-radius:3px;white-space:normal;overflow:visible;line-height:1.25}
.dbadge-label{display:block;font-weight:700;opacity:.75;margin-bottom:1px}
.dbadge-names{display:block;overflow:visible;text-overflow:clip;white-space:normal;word-break:keep-all}
.dbadge.open{background:#EAF3DE;color:#27500A}
.dbadge.mid{background:#E1F5EE;color:#085041}
.dbadge.close{background:#EEEDFE;color:#3C3489}
.dbadge.off{background:#FAECE7;color:#712B13}
.dbadge.annual{background:#FAEEDA;color:#633806}
.dbadge.half_am{background:#F0E8F8;color:#5B2E91}
.dbadge.half_pm{background:#EAE1F8;color:#4A2080}
.dbadge.quarter{background:#F5EDF8;color:#6B35A0}

.pos-mark{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:#C8844A;border-radius:2px;padding:0 2px;margin-left:2px;line-height:1.3;vertical-align:middle}
.dbadge-spacer{flex:1;min-height:0}
.stats-wrap{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;margin-bottom:12px}
.stats-wrap h4{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat-block{background:var(--color-background-secondary);border-radius:8px;padding:10px}
.stat-block .sl{font-size:11px;color:var(--color-text-secondary);margin-bottom:6px;font-weight:500}
.stat-names{display:flex;flex-wrap:wrap;gap:4px}
.stat-chip{font-size:12px;padding:3px 8px;border-radius:12px;border:0.5px solid transparent}

.emp-section{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px}
.emp-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.emp-toolbar h3{font-size:14px;font-weight:500}
.btn-add{padding:8px 14px;font-size:13px;border:0.5px solid #C8844A;border-radius:8px;cursor:pointer;background:#F5EDE3;color:#7D4A1A;min-height:36px}
.btn-add:active{opacity:.7}

.emp-card{padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.emp-card:last-child{border-bottom:none}
.emp-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.emp-title{min-width:0}
.emp-name{display:block;font-size:15px;font-weight:600;line-height:1.25}
.emp-position{display:inline-flex;margin-top:4px;padding:2px 7px;border-radius:8px;background:#EEF3F7;color:#31536B;font-size:11px;font-weight:500;line-height:1.3}
.emp-badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:500}
.emp-badge.full{background:#EAF3DE;color:#27500A}
.emp-badge.part{background:#FAEEDA;color:#633806}
.emp-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-bottom:6px}
.emp-info-item{font-size:12px;color:var(--color-text-secondary)}
.emp-info-item span{color:var(--color-text-primary);font-weight:500}
.emp-row3{display:flex;gap:6px}
.annual-chip{flex:1;text-align:center;padding:6px 4px;border-radius:8px;background:var(--color-background-secondary)}
.annual-chip .ac-label{font-size:10px;color:var(--color-text-secondary);margin-bottom:2px}
.annual-chip .ac-val{font-size:15px;font-weight:500}
.annual-chip.editable{position:relative;padding-right:28px}
.btn-annual-edit{position:absolute;top:6px;right:6px;width:22px;height:22px;border:1px solid #D8C9BA;border-radius:50%;background:#fff;color:#7D4A1A;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-annual-edit:active{background:#F5EDE3}
.btn-del{padding:6px 12px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:8px;cursor:pointer;background:transparent;color:var(--color-text-secondary);min-height:36px}
.btn-del:active{background:#FCEBEB;color:#A32D2D}
.empty-msg{text-align:center;color:var(--color-text-secondary);font-size:14px;padding:28px 0}
.emp-note{font-size:11px;color:var(--color-text-secondary);margin-top:12px;padding-top:10px;border-top:0.5px solid var(--color-border-tertiary);line-height:1.6}

.overlay-wrap{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;z-index:201;position:relative;box-shadow:0 -10px 30px rgba(0,0,0,.16)}
.modal-handle{width:36px;height:4px;background:var(--color-border-secondary);border-radius:2px;margin:0 auto 16px}
.modal h3{font-size:16px;font-weight:500;margin-bottom:16px}
.form-card{border:1px solid #E6D8CA;border-radius:12px;background:#FBF6EF;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(70,45,25,.04)}
.form-card.primary{border-color:#DDBB9C;background:#FFF7EE}
.form-card-title{font-size:13px;font-weight:700;color:#4B4037;margin-bottom:12px}
.form-row{margin-bottom:12px}
.form-row:last-child{margin-bottom:0}
.form-row label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.form-row input,.form-row select{width:100%;padding:10px 12px;font-size:15px;border:1px solid #D8C9BA;border-radius:10px;background:#fff;color:var(--color-text-primary);min-height:44px}
.date-triplet{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:6px}
.date-triplet input{text-align:center}
.date-triplet input::placeholder{color:var(--color-text-tertiary,#AAA)}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns button{flex:1;padding:12px;font-size:15px;border:0.5px solid var(--color-border-secondary);border-radius:10px;cursor:pointer;min-height:48px}
.btn-cancel{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.btn-confirm{background:#F5EDE3;border-color:#C8844A;color:#7D4A1A;font-weight:500}
.btn-confirm:active{opacity:.7}

.shift-section{margin-bottom:12px;border:1px solid #E6D8CA;border-radius:12px;background:#FBF6EF;padding:12px}
.shift-title{font-size:13px;font-weight:700;color:#4B4037;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #E6D8CA}
.emp-btn-grid{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.emp-pick-btn{padding:9px 14px;font-size:14px;border:0.5px solid var(--color-border-secondary);border-radius:20px;cursor:pointer;background:transparent;color:var(--color-text-primary);min-height:44px}
.emp-pick-btn:active{opacity:.7}
.emp-pick-btn.sel-open{background:#EAF3DE;border-color:#639922;color:#27500A}
.emp-pick-btn.sel-mid{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.emp-pick-btn.sel-close{background:#EEEDFE;border-color:#7F77DD;color:#3C3489}
.emp-pick-btn.sel-off{background:#FAECE7;border-color:#D85A30;color:#712B13}
.emp-pick-btn.sel-annual{background:#FAEEDA;border-color:#EF9F27;color:#633806}
.emp-pick-btn.sel-half_am{background:#F0E8F8;border-color:#9B5DC8;color:#5B2E91}
.emp-pick-btn.sel-half_pm{background:#EAE1F8;border-color:#7A4DB8;color:#4A2080}
.emp-pick-btn.sel-quarter{background:#F5EDF8;border-color:#8B4BBE;color:#6B35A0}
.close-btn{width:100%;padding:13px;font-size:15px;border:0.5px solid var(--color-border-secondary);border-radius:10px;cursor:pointer;background:var(--color-background-secondary);color:var(--color-text-secondary);min-height:48px;margin-top:8px}

.mgmt-wrap{padding:12px 0}
.mgmt-wrap h3{font-size:16px;font-weight:500;margin-bottom:16px}
.store-card{border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--color-background-secondary)}
.store-name-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.store-name-row input{flex:1;padding:9px 12px;font-size:15px;border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--color-background-primary);color:var(--color-text-primary);min-height:44px}
.sec-toggle-row{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.sec-toggle-label{font-size:12px;color:var(--color-text-secondary);white-space:nowrap}
.sec-tag{padding:7px 14px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:20px;cursor:pointer;background:transparent;color:var(--color-text-secondary);min-height:36px}
.sec-tag.on{background:#EAF3DE;border-color:#639922;color:#27500A}
.sec-tag:active{opacity:.7}
.store-action-row{display:flex;gap:6px}
.btn-store-save{flex:1;padding:9px;font-size:13px;border:0.5px solid #C8844A;border-radius:8px;cursor:pointer;background:#F5EDE3;color:#7D4A1A;min-height:40px}
.btn-store-del{padding:9px 14px;font-size:13px;border:0.5px solid #F09595;border-radius:8px;cursor:pointer;background:transparent;color:#A32D2D;min-height:40px}
.btn-store-del:active{background:#FCEBEB}
.btn-add-store{width:100%;padding:14px;font-size:15px;border:0.5px solid #C8844A;border-radius:10px;cursor:pointer;background:#F5EDE3;color:#7D4A1A;font-weight:500;min-height:52px;margin-top:6px}
.btn-add-store:active{opacity:.7}
.admin-card{border:1px solid #E6D8CA;border-radius:12px;padding:14px;margin-bottom:12px;background:#FBF6EF}
.admin-card h4{font-size:14px;font-weight:700;margin-bottom:10px;color:#4B4037}
.admin-card p{font-size:12px;line-height:1.5;color:var(--color-text-secondary);margin-bottom:10px}
.admin-row{display:flex;gap:6px;align-items:center;margin-top:8px}
.admin-row input{flex:1;min-width:0;padding:10px 12px;font-size:15px;border:1px solid #D8C9BA;border-radius:10px;background:#fff;color:var(--color-text-primary);min-height:44px}
.btn-admin{padding:10px 14px;font-size:13px;border:1px solid #C8844A;border-radius:10px;background:#F5EDE3;color:#7D4A1A;font-weight:600;min-height:44px;cursor:pointer;white-space:nowrap}
.btn-admin.secondary{border-color:#D8C9BA;background:#fff;color:var(--color-text-secondary)}
.admin-error{font-size:12px;color:#A32D2D;margin-top:8px;min-height:18px}

/* ── Store tab edit ── */
.tab-name-wrap{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tab-pencil{font-size:11px;opacity:.55;cursor:pointer;padding:2px 3px;border-radius:4px;background:transparent;border:none;color:inherit;line-height:1;vertical-align:middle}
.tab-pencil:active{opacity:1;background:rgba(0,0,0,.08)}

/* ── Section delete ── */
.sec-btn-wrap{display:inline-flex;align-items:center;flex:none}
.sec-del{font-size:11px;padding:0 5px 0 1px;cursor:pointer;background:transparent;border:none;color:#A32D2D;line-height:1;opacity:.6}
.sec-del:active{opacity:1}

/* ── Memo section ── */
.memo-section{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:12px;margin-bottom:12px}
.memo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.memo-header h4{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.memo-save-btn{padding:5px 12px;font-size:12px;border:0.5px solid #C8844A;border-radius:8px;cursor:pointer;background:#F5EDE3;color:#7D4A1A;min-height:30px}
.memo-save-btn:active{opacity:.7}
.memo-save-btn.saved{background:#EAF3DE;border-color:#639922;color:#27500A}
.memo-textarea{width:100%;min-height:90px;padding:10px;font-size:13px;font-family:var(--font-sans);border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-primary);resize:none;line-height:1.6;outline:none}
.memo-textarea:focus{border-color:#C8844A;background:#fff}
.memo-textarea::placeholder{color:var(--color-text-tertiary,#BBB)}

/* page padding */
.page-pad{padding:0 0}
@media (max-width:360px){
  .app{padding-left:10px;padding-right:10px}
  .cal-wrap,.stats-wrap,.emp-section{padding:10px}
  .emp-row2{grid-template-columns:1fr}
  .emp-row3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .annual-chip{min-height:48px}
  .btn-del{grid-column:1/-1}
  .modal{padding:18px 12px 28px}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<div class="app" id="app"></div>

<script>
const DOWS=['일','월','화','수','목','금','토'];
// 반차/반반차 포함

// 연장 근무 시간 키: '__ot__이름' → 시간 수 (숫자)
function otKey(name){return '__ot__'+name;}
function getOT(dayData,name){const v=dayData[otKey(name)];return(v&&v>0)?v:0;}
// 연장 근무 사유 키: '__otr__이름' → 사유 문자열
function otrKey(name){return '__otr__'+name;}
function getOTR(dayData,name){return dayData[otrKey(name)]||'';}

function empKey(sid,sec){return `${sid}__${sec}`}
function schedKey(sid,sec,y,m){return `${sid}__${sec}__${y}__${m}`}
function getEmps(sid,sec){return APP.employees[empKey(sid,sec)]||[]}
function setEmps(sid,sec,arr){APP.employees[empKey(sid,sec)]=arr}
function getSched(sid,sec,y,m){const k=schedKey(sid,sec,y,m);if(!APP.schedules[k])APP.schedules[k]={};return APP.schedules[k]}
function save(){try{const data={...APP,adminUnlocked:false};localStorage.setItem('hr_mob_v2',JSON.stringify(data));sessionStorage.setItem('hr_mob_v2',JSON.stringify(data))}catch(e){}}
function load(){try{const raw=localStorage.getItem('hr_mob_v2')||sessionStorage.getItem('hr_mob_v2');const d=JSON.parse(raw);if(d&&d.stores)Object.assign(APP,d);if(!APP.adminPassword)APP.adminPassword='hare';APP.adminUnlocked=false}catch(e){}}
load();

function calcAnnual(emp,sid,sec,y,m){
  if(!emp.joinDate||emp.type==='일용직')return{gen:0,used:0};
  const join=new Date(emp.joinDate);
  const now=new Date();
  if(join>now)return{gen:0,used:0};
  let autoGen=0;
  if(now.getFullYear()===join.getFullYear()){
    let months=(now.getFullYear()-join.getFullYear())*12+(now.getMonth()-join.getMonth());
    if(now.getDate()<join.getDate())months--;
    autoGen=Math.max(0,Math.floor(months));
  } else {
    autoGen=Math.min(15+Math.floor((now.getFullYear()-join.getFullYear()-1)/2),25);
  }
  const manual=Number(emp.annualManual);
  const gen=Number.isFinite(manual)&&emp.annualManual!==''?Math.max(0,manual):autoGen;
  const sched=getSched(sid,sec,y,m);
  let used=0;
  Object.values(sched).forEach(d=>{
    const sh=d[emp.name];
    if(sh&&SHIFT_ANNUAL_WEIGHT[sh])used+=SHIFT_ANNUAL_WEIGHT[sh];
  });
  const manualUsed=Number(emp.annualUsedManual);
  if(Number.isFinite(manualUsed)&&emp.annualUsedManual!=='')used=Math.max(0,manualUsed);
  return{gen,used:Math.round(used*100)/100};
}
function getStore(){return APP.stores.find(s=>s.id===APP.activeStoreId)||null}
function todayStr(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function splitDateValue(value){
  const [year='',month='',day='']=(value||'').split('-');
  return{year,month,day};
}
function joinDateValue(prefix,scope){
  const y=scope.querySelector(`#${prefix}-year`).value.trim();
  const m=scope.querySelector(`#${prefix}-month`).value.trim();
  const d=scope.querySelector(`#${prefix}-day`).value.trim();
  if(!y&&!m&&!d)return'';
  if(y.length!==4||m.length<1||d.length<1)return'';
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function dateFields(prefix,label,value,required=false){
  const d=splitDateValue(value);
  return `<div class="form-row"><label>${label}${required?' *':''}</label><div class="date-triplet">
    <input id="${prefix}-year" type="text" inputmode="numeric" maxlength="4" placeholder="연도" value="${d.year}">
    <input id="${prefix}-month" type="text" inputmode="numeric" maxlength="2" placeholder="월" value="${d.month}">
    <input id="${prefix}-day" type="text" inputmode="numeric" maxlength="2" placeholder="일" value="${d.day}">
  </div></div>`;
}
function wireDateFields(prefix,scope,onChange){
  const y=scope.querySelector(`#${prefix}-year`);
  const m=scope.querySelector(`#${prefix}-month`);
  const d=scope.querySelector(`#${prefix}-day`);
  [[y,4,m],[m,2,d],[d,2,null]].forEach(([input,max,next])=>{
    input.oninput=()=>{
      input.value=input.value.replace(/\D/g,'').slice(0,max);
      if(input.value.length===max&&next)next.focus();
      onChange(joinDateValue(prefix,scope));
    };
  });
}
function countShiftInMonth(sched,name,shift,untilDayKey=null){
  return Object.keys(sched).sort().reduce((count,dk)=>{
    if(untilDayKey&&dk>untilDayKey)return count;
    return (sched[dk]&&sched[dk][name]===shift)?count+1:count;
  },0);
}
function calendarDisplayName(name){
  const clean=(name||'').trim();
  const compoundSurnames=['남궁','황보','제갈','사공','선우','서문','독고','동방'];
  const compound=compoundSurnames.find(s=>clean.startsWith(s));
  if(compound&&clean.length>compound.length)return clean.slice(compound.length);
  if(clean.length>1)return clean.slice(1);
  return clean;
}
function displayNameWithShiftCount(sched,name,shift,dayKey){
  if(!['오픈','미들','마감','휴무'].includes(shift))return name;
  return `${calendarDisplayName(name)}${countShiftInMonth(sched,name,shift,dayKey)}`;
}

function getKoreanHolidays(year){
  const h={};
  const add=(m,d,name)=>{h[`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`]=name};
  add(1,1,'신정');add(3,1,'삼일절');add(5,5,'어린이날');
  add(6,6,'현충일');add(8,15,'광복절');add(10,3,'개천절');
  add(10,9,'한글날');add(12,25,'성탄절');
  // 석가탄신일 (음력 4월 15일 → 양력)
  const buddhaMap={2024:'05-15',2025:'05-05',2026:'05-24',2027:'05-13',2028:'05-02',2029:'05-20'};
  if(buddhaMap[year])h[`${year}-${buddhaMap[year]}`]='부처님오신날';
  // 대체공휴일 (일요일·공휴일 겹침 시 다음 평일)
  // 2026년 예시 추가 대체공휴일
  const subMap={2025:{'01-27':'대체공휴일','05-06':'대체공휴일'},2026:{'03-02':'대체공휴일','06-08':'대체공휴일'},2027:{}};
  if(subMap[year])Object.assign(h,subMap[year]);
  // 설날 (음력 1월 1일 전후 3일)
  const seolMap={2024:['02-09','02-10','02-11','02-12'],2025:['01-28','01-29','01-30','01-31'],2026:['02-17','02-18','02-19','02-20'],2027:['02-06','02-07','02-08','02-09'],2028:['01-26','01-27','01-28','01-29']};
  if(seolMap[year]){const names=['설날연휴','설날','설날연휴','대체공휴일'];seolMap[year].forEach((d,i)=>{h[`${year}-${d}`]=names[i]||'설날연휴'});}
  // 추석 (음력 8월 15일 전후 3일)
  const chuseokMap={2024:['09-16','09-17','09-18'],2025:['10-05','10-06','10-07','10-08'],2026:['09-24','09-25','09-26','09-27'],2027:['10-14','10-15','10-16'],2028:['10-02','10-03','10-04']};
  if(chuseokMap[year]){const names=['추석연휴','추석','추석연휴','대체공휴일'];chuseokMap[year].forEach((d,i)=>{h[`${year}-${d}`]=names[i]||'추석연휴'});}
  return h;
}

function renderCalendar(parent,store){
  const wrap=document.createElement('div');wrap.className='cal-wrap';
  const hdr=document.createElement('div');hdr.className='cal-header';
  const title=document.createElement('h3');title.textContent=`${APP.calYear}년 ${APP.calMonth+1}월 달력`;
  const navDiv=document.createElement('div');navDiv.className='cal-nav';
  const prev=document.createElement('button');prev.textContent='‹';
  prev.onclick=()=>{APP.calMonth--;if(APP.calMonth<0){APP.calMonth=11;APP.calYear--;}render()};
  const next=document.createElement('button');next.textContent='›';
  next.onclick=()=>{APP.calMonth++;if(APP.calMonth>11){APP.calMonth=0;APP.calYear++;}render()};
  navDiv.appendChild(prev);navDiv.appendChild(next);
  hdr.appendChild(title);hdr.appendChild(navDiv);wrap.appendChild(hdr);

  const grid=document.createElement('div');grid.className='cal-grid';
  DOWS.forEach((d,i)=>{
    const el=document.createElement('div');el.className='cal-dow';el.textContent=d;
    if(i===0)el.style.color='#A32D2D';
    if(i===6)el.style.color='#185FA5';
    grid.appendChild(el);
  });

  const firstDay=new Date(APP.calYear,APP.calMonth,1).getDay();
  const daysInMonth=new Date(APP.calYear,APP.calMonth+1,0).getDate();
  const today=new Date();
  const sched=getSched(store.id,APP.activeSection,APP.calYear,APP.calMonth);
  const holidays=getKoreanHolidays(APP.calYear);
  // 매장/공장 각 섹션 직원 생일 맵: "MM-DD" → [이름, ...]
  const birthdayMap={};
  // 현재 섹션 직원만
  getEmps(store.id,APP.activeSection).forEach(e=>{
    if(!e.birthday)return;
    const parts=e.birthday.split('-');
    if(parts.length<3)return;
    const key=`${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
    if(!birthdayMap[key])birthdayMap[key]=[];
    birthdayMap[key].push(e.name);
  });

  for(let i=0;i<firstDay;i++){const el=document.createElement('div');el.className='cal-day empty';grid.appendChild(el);}

  for(let d=1;d<=daysInMonth;d++){
    const dow=new Date(APP.calYear,APP.calMonth,d).getDay();
    const isToday=today.getFullYear()===APP.calYear&&today.getMonth()===APP.calMonth&&today.getDate()===d;
    const dayKey=`${APP.calYear}-${String(APP.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const holidayName=holidays[dayKey]||'';
    const isHoliday=!!holidayName;
    const cell=document.createElement('div');
    cell.className='cal-day'+(isToday?' today':'')+(dow===0?' sun':'')+(dow===6?' sat':'')+(isHoliday&&dow!==0?' holiday':'');
    const dn=document.createElement('div');dn.className='day-num';
    const digit=document.createElement('span');digit.className='day-num-digit';digit.textContent=d;dn.appendChild(digit);
    // 공휴일명 + 생일을 묶는 extra 컬럼
    const mmdd=`${String(APP.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bdNames=birthdayMap[mmdd]||[];
    if(holidayName||bdNames.length){
      const extra=document.createElement('span');extra.className='day-num-extra';
      if(holidayName){const hn=document.createElement('span');hn.className='holiday-name';hn.textContent=holidayName;extra.appendChild(hn);}
      bdNames.forEach(bname=>{
        const bn=document.createElement('span');bn.className='birthday-name';
        bn.textContent=calendarDisplayName(bname)+'생일';extra.appendChild(bn);
      });
      dn.appendChild(extra);
    }
    cell.appendChild(dn);

    const dayData=sched[dayKey]||{};
    const byShift={오픈:[],미들:[],마감:[],휴무:[],연차:[],오전반차:[],오후반차:[],반반차:[]};
    Object.entries(dayData).forEach(([n,s])=>{if(byShift[s])byShift[s].push(n)});

    const badges=document.createElement('div');badges.className='day-badges';
    // Fixed 4-row layout: 오픈 / 미들(or spacer) / 마감 / 휴무
    // 오픈·마감: 이름만 표시 (포스자는 ★ 표기), 카운트 없음
    // 미들: 이름 표시, 없으면 빈 공간
    // 휴무: 이름+월누적횟수
    const empsForDay=getEmps(store.id,APP.activeSection);
    // 날짜별 POS 담당자: dayData['__pos__이름'] = true
    const posNames=new Set(Object.keys(dayData||{}).filter(k=>k.startsWith('__pos__')).map(k=>k.slice(7)));

    // helper: render name with pos mark and overtime
    function renderNameWithPos(name){
      const ot=getOT(dayData,name);
      const otStr=ot>0?`<span style="font-size:8px;font-weight:700;color:#185FA5;margin-left:1px">+${ot}h</span>`:'';
      return posNames.has(name)?`${calendarDisplayName(name)}<span class="pos-mark">P</span>${otStr}`:calendarDisplayName(name)+otStr;
    }

    // 오픈/미들/마감/휴무: 있으면 badge, 없으면 spacer (높이 균등 분배)
    // 오픈
    if(byShift['오픈'].length){
      const b=document.createElement('div');b.className=`dbadge ${SHIFT_CLS['오픈']}`;
      b.innerHTML=`<span class="dbadge-label">오픈</span><span class="dbadge-names">${byShift['오픈'].map(n=>renderNameWithPos(n)).join(' ')}</span>`;
      badges.appendChild(b);
    }
    // 미들
    if(byShift['미들'].length){
      const b=document.createElement('div');b.className=`dbadge ${SHIFT_CLS['미들']}`;
      b.innerHTML=`<span class="dbadge-label">미들</span><span class="dbadge-names">${byShift['미들'].map(n=>{const ot=getOT(dayData,n);return calendarDisplayName(n)+(ot>0?`<span style="font-size:8px;font-weight:700;color:#185FA5;margin-left:1px">+${ot}h</span>`:'');}).join(' ')}</span>`;
      badges.appendChild(b);
    }
    // 마감
    if(byShift['마감'].length){
      const b=document.createElement('div');b.className=`dbadge ${SHIFT_CLS['마감']}`;
      b.innerHTML=`<span class="dbadge-label">마감</span><span class="dbadge-names">${byShift['마감'].map(n=>renderNameWithPos(n)).join(' ')}</span>`;
      badges.appendChild(b);
    }
    // 휴무 (이름+월누적 횟수)
    if(byShift['휴무'].length){
      const b=document.createElement('div');b.className=`dbadge ${SHIFT_CLS['휴무']}`;
      const short=byShift['휴무'].map(n=>displayNameWithShiftCount(sched,n,'휴무',dayKey)).join(' ');
      b.innerHTML=`<span class="dbadge-label">휴무</span><span class="dbadge-names">${short}</span>`;
      badges.appendChild(b);
    }
    cell.appendChild(badges);

    const emps=getEmps(store.id,APP.activeSection);
    cell.onclick=()=>{
      if(emps.length===0){alert('직원을 먼저 등록해주세요.');return;}
      APP.modal={type:'day',storeId:store.id,section:APP.activeSection,dayKey,y:APP.calYear,m:APP.calMonth,d};
      render();
    };
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);parent.appendChild(wrap);
}

function renderStats(parent,store){
  const emps=getEmps(store.id,APP.activeSection);
  const sched=getSched(store.id,APP.activeSection,APP.calYear,APP.calMonth);
  // per-employee counters
  const openMap={},midMap={},closeMap={},offMap={},annualMap={},halfMap={},otMap={};
  emps.forEach(e=>{openMap[e.name]=0;midMap[e.name]=0;closeMap[e.name]=0;offMap[e.name]=0;annualMap[e.name]=0;halfMap[e.name]=0;otMap[e.name]=0;});
  Object.entries(sched).forEach(([dk,day])=>Object.entries(day).forEach(([n,s])=>{
    if(s==='오픈')openMap[n]=(openMap[n]||0)+1;
    else if(s==='미들')midMap[n]=(midMap[n]||0)+1;
    else if(s==='마감')closeMap[n]=(closeMap[n]||0)+1;
    else if(s==='휴무')offMap[n]=(offMap[n]||0)+1;
    else if(s==='연차')annualMap[n]=(annualMap[n]||0)+1;
    else if(['오전반차','오후반차','반반차'].includes(s))halfMap[n]=(halfMap[n]||0)+1;
    // 연장 시간 집계
    if(n.startsWith('__ot__')){const empName=n.slice(6);if(otMap[empName]!==undefined)otMap[empName]=Math.round(((otMap[empName]||0)+Number(s))*10)/10;}
  }));

  const wrap=document.createElement('div');wrap.className='stats-wrap';
  // 토글 헤더
  const toggleKey='stats_open_'+APP.activeStoreId+'_'+APP.activeSection;
  if(APP._toggles===undefined)APP._toggles={};
  const isStatsOpen=!!APP._toggles[toggleKey];
  const h4=document.createElement('div');
  h4.style.cssText='display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0;user-select:none';
  h4.innerHTML=`<span style="font-size:13px;font-weight:500;color:var(--color-text-secondary)">${APP.calYear}년 ${APP.calMonth+1}월 월별 현황</span><span style="font-size:11px;color:var(--color-text-secondary)">${isStatsOpen?'▲':'▼'}</span>`;
  wrap.appendChild(h4);
  const statsBody=document.createElement('div');
  statsBody.style.display=isStatsOpen?'block':'none';
  statsBody.style.marginTop='10px';
  h4.onclick=()=>{APP._toggles[toggleKey]=!APP._toggles[toggleKey];render();};

  // ── 직원별 월별 근무 횟수 ──────────────────────────────────────────
  const tbl=document.createElement('div');tbl.style.cssText='width:100%;overflow-x:auto;margin-bottom:12px';
  const table=document.createElement('table');
  table.style.cssText='width:100%;border-collapse:collapse;font-size:12px;min-width:340px';
  // header
  const thead=document.createElement('thead');
  const hrow=document.createElement('tr');
  ['이름','오픈','미들','마감','휴무','연장h'].forEach((h,i)=>{
    const th=document.createElement('th');
    th.textContent=h;
    th.style.cssText=`padding:6px 4px;text-align:center;border-bottom:1.5px solid var(--color-border-secondary);font-weight:600;color:var(--color-text-secondary);font-size:11px;white-space:nowrap;background:var(--color-background-secondary);${i===0?'text-align:left;padding-left:8px;':''}`;
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);table.appendChild(thead);

  const tbody=document.createElement('tbody');
  if(emps.length===0){
    const tr=document.createElement('tr');
    const td=document.createElement('td');
    td.colSpan=6;
    td.textContent='등록된 직원이 없습니다.';
    td.style.cssText='padding:10px 8px;text-align:center;font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary)';
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  emps.forEach((e,idx)=>{
    const tr=document.createElement('tr');
    tr.style.background=idx%2===0?'var(--color-background-primary)':'var(--color-background-secondary)';
    const vals=[
      {v:e.name,align:'left',pl:'8px',bold:true,color:'var(--color-text-primary)'},
      {v:openMap[e.name]||0,color:'#27500A',bg:'#EAF3DE'},
      {v:midMap[e.name]||0,color:'#085041',bg:'#E1F5EE'},
      {v:closeMap[e.name]||0,color:'#3C3489',bg:'#EEEDFE'},
      {v:offMap[e.name]||0,color:offMap[e.name]>=8?'#A32D2D':'#712B13',bg:'#FAECE7'},
      {v:(otMap[e.name]||0)>0?`+${otMap[e.name]}h`:'0h',color:(otMap[e.name]||0)>0?'#185FA5':'var(--color-text-secondary)',bg:(otMap[e.name]||0)>0?'#E8F0FB':null},
    ];
    vals.forEach((cell,ci)=>{
      const td=document.createElement('td');
      td.textContent=cell.v;
      let css=`padding:6px 4px;text-align:center;font-size:12px;`;
      if(cell.align==='left')css+=`text-align:left;padding-left:${cell.pl||'4px'};`;
      if(cell.bold)css+=`font-weight:600;`;
      if(cell.color)css+=`color:${cell.color};`;
      if(cell.bg&&cell.v!==0&&cell.v!=='0')css+=`background:${cell.bg};border-radius:4px;`;
      td.style.cssText=css;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });


  table.appendChild(tbody);
  tbl.appendChild(table);statsBody.appendChild(tbl);

  const leaveDetails=[];
  const empNames=new Set(emps.map(e=>e.name));
  Object.keys(sched).sort().forEach(dayKey=>{
    const day=sched[dayKey]||{};
    Object.entries(day).forEach(([name,shift])=>{
      if(!empNames.has(name)||!SHIFT_ANNUAL_WEIGHT[shift])return;
      leaveDetails.push({
        name,
        dayKey,
        used:SHIFT_ANNUAL_WEIGHT[shift],
        reason:SHIFT_LABELS[shift]||shift
      });
    });
  });

  const detailWrap=document.createElement('div');
  detailWrap.style.cssText='width:100%;overflow-x:auto;margin-top:14px';
  const detailTitle=document.createElement('div');
  detailTitle.textContent='연차 사용 세부정보';
  detailTitle.style.cssText='font-size:12px;font-weight:600;color:var(--color-text-secondary);margin:0 0 8px 2px';
  detailWrap.appendChild(detailTitle);

  if(leaveDetails.length===0){
    const empty=document.createElement('div');
    empty.textContent='등록된 연차/반차/반반차 사용 내역이 없습니다.';
    empty.style.cssText='padding:10px 8px;border-radius:8px;background:var(--color-background-secondary);font-size:12px;color:var(--color-text-secondary);text-align:center';
    detailWrap.appendChild(empty);
  } else {
    const detailTable=document.createElement('table');
    detailTable.style.cssText='width:100%;border-collapse:collapse;font-size:12px;min-width:420px';
    const detailHead=document.createElement('thead');
    const detailHeadRow=document.createElement('tr');
    ['직원이름','일자','사용일수','사유'].forEach((h,i)=>{
      const th=document.createElement('th');
      th.textContent=h;
      th.style.cssText=`padding:6px 4px;text-align:center;border-bottom:1.5px solid var(--color-border-secondary);font-weight:600;color:var(--color-text-secondary);font-size:11px;white-space:nowrap;background:var(--color-background-secondary);${i===0?'text-align:left;padding-left:8px;':''}`;
      detailHeadRow.appendChild(th);
    });
    detailHead.appendChild(detailHeadRow);detailTable.appendChild(detailHead);

    const detailBody=document.createElement('tbody');
    leaveDetails.forEach((item,idx)=>{
      const tr=document.createElement('tr');
      tr.style.background=idx%2===0?'var(--color-background-primary)':'var(--color-background-secondary)';
      [
        {v:item.name,align:'left',bold:true,color:'var(--color-text-primary)'},
        {v:item.dayKey,color:'var(--color-text-secondary)'},
        {v:item.used+'일',color:item.used>=1?'#A32D2D':'#633806'},
        {v:item.reason,color:item.reason.includes('연차')?'#A32D2D':item.reason.includes('반반차')?'#633806':'#7D4A1A'}
      ].forEach((cell,ci)=>{
        const td=document.createElement('td');
        td.textContent=cell.v;
        let css='padding:6px 4px;text-align:center;font-size:12px;white-space:nowrap;';
        if(cell.align==='left')css+='text-align:left;padding-left:8px;';
        if(cell.bold)css+='font-weight:600;';
        if(cell.color)css+=`color:${cell.color};`;
        td.style.cssText=css;
        tr.appendChild(td);
      });
      detailBody.appendChild(tr);
    });
    detailTable.appendChild(detailBody);
    detailWrap.appendChild(detailTable);
  }
  statsBody.appendChild(detailWrap);

  // ── 연장 근무 세부정보 ──────────────────────────────────
  const otDetailWrap=document.createElement('div');
  otDetailWrap.style.cssText='width:100%;overflow-x:auto;margin-top:14px';
  const otDetailTitle=document.createElement('div');
  otDetailTitle.textContent='연장 근무 세부정보';
  otDetailTitle.style.cssText='font-size:12px;font-weight:600;color:var(--color-text-secondary);margin:0 0 8px 2px';
  otDetailWrap.appendChild(otDetailTitle);

  // 연장 근무 데이터 수집
  const otDetails=[];
  Object.keys(sched).sort().forEach(dk=>{
    const day=sched[dk]||{};
    Object.keys(day).forEach(k=>{
      if(!k.startsWith('__ot__'))return;
      const empName=k.slice(6);
      if(!empNames.has(empName))return;
      const hours=Number(day[k]);
      if(!hours||hours<=0)return;
      const reason=getOTR(day,empName);
      otDetails.push({name:empName,dayKey:dk,hours,reason});
    });
  });

  if(otDetails.length===0){
    const empty=document.createElement('div');
    empty.textContent='등록된 연장 근무 내역이 없습니다.';
    empty.style.cssText='padding:10px 8px;border-radius:8px;background:var(--color-background-secondary);font-size:12px;color:var(--color-text-secondary);text-align:center';
    otDetailWrap.appendChild(empty);
  } else {
    const otTable=document.createElement('table');
    otTable.style.cssText='width:100%;border-collapse:collapse;font-size:12px;min-width:420px';
    const otHead=document.createElement('thead');
    const otHeadRow=document.createElement('tr');
    ['직원이름','일자','연장시간','사유'].forEach((h,i)=>{
      const th=document.createElement('th');
      th.textContent=h;
      th.style.cssText=`padding:6px 4px;text-align:center;border-bottom:1.5px solid var(--color-border-secondary);font-weight:600;color:var(--color-text-secondary);font-size:11px;white-space:nowrap;background:var(--color-background-secondary);${i===0?'text-align:left;padding-left:8px;':''}`;
      otHeadRow.appendChild(th);
    });
    otHead.appendChild(otHeadRow);otTable.appendChild(otHead);

    const otBody2=document.createElement('tbody');
    otDetails.forEach((item,idx)=>{
      const tr=document.createElement('tr');
      tr.style.background=idx%2===0?'var(--color-background-primary)':'var(--color-background-secondary)';

      // 직원명
      const tdName=document.createElement('td');
      tdName.textContent=item.name;
      tdName.style.cssText='padding:6px 4px;text-align:left;padding-left:8px;font-size:12px;font-weight:600;color:var(--color-text-primary);white-space:nowrap';
      tr.appendChild(tdName);

      // 일자
      const tdDay=document.createElement('td');
      tdDay.textContent=item.dayKey;
      tdDay.style.cssText='padding:6px 4px;text-align:center;font-size:12px;color:var(--color-text-secondary);white-space:nowrap';
      tr.appendChild(tdDay);

      // 연장시간
      const tdHours=document.createElement('td');
      tdHours.textContent=`+${item.hours}h`;
      tdHours.style.cssText='padding:6px 4px;text-align:center;font-size:12px;font-weight:600;color:#185FA5;white-space:nowrap';
      tr.appendChild(tdHours);

      // 사유 (인라인 편집 가능)
      const tdReason=document.createElement('td');
      tdReason.style.cssText='padding:4px;min-width:100px';
      const reasonInp=document.createElement('input');
      reasonInp.type='text';
      reasonInp.value=item.reason;
      reasonInp.placeholder='사유 입력';
      reasonInp.style.cssText='width:100%;padding:4px 6px;font-size:11px;border:1px solid #E6D8CA;border-radius:6px;background:transparent;color:var(--color-text-primary);outline:none';
      reasonInp.onfocus=()=>{reasonInp.style.background='#fff';reasonInp.style.borderColor='#C8844A';};
      reasonInp.onblur=()=>{reasonInp.style.background='transparent';reasonInp.style.borderColor='#E6D8CA';};
      reasonInp.oninput=()=>{
        const v=reasonInp.value.trim();
        const dayD=sched[item.dayKey];
        if(!dayD)return;
        if(v)dayD[otrKey(item.name)]=v;
        else delete dayD[otrKey(item.name)];
        save();
      };
      tdReason.appendChild(reasonInp);
      tr.appendChild(tdReason);

      otBody2.appendChild(tr);
    });
    otTable.appendChild(otBody2);
    otDetailWrap.appendChild(otTable);
  }
  statsBody.appendChild(otDetailWrap);

  wrap.appendChild(statsBody);
  parent.appendChild(wrap);
}

function getMemoKey(storeId,section,y,m){return `memo_${storeId}_${section}_${y}_${m}`;}
function getMemo(storeId,section,y,m){return(APP.memos&&APP.memos[getMemoKey(storeId,section,y,m)])||'';}
function setMemo(storeId,section,y,m,text){if(!APP.memos)APP.memos={};APP.memos[getMemoKey(storeId,section,y,m)]=text;}

function renderMemo(parent,store){
  const sec=APP.activeSection;
  const y=APP.calYear,m=APP.calMonth;
  const wrap=document.createElement('div');wrap.className='memo-section';

  const hdr=document.createElement('div');hdr.className='memo-header';
  const title=document.createElement('h4');title.textContent='📝 메모';
  const saveBtn=document.createElement('button');saveBtn.className='memo-save-btn';saveBtn.textContent='저장';
  hdr.appendChild(title);hdr.appendChild(saveBtn);wrap.appendChild(hdr);

  const ta=document.createElement('textarea');
  ta.className='memo-textarea';
  ta.placeholder=`${APP.calYear}년 ${APP.calMonth+1}월 ${store.name} ${sec} 메모를 입력하세요...`;
  ta.value=getMemo(store.id,sec,y,m);
  wrap.appendChild(ta);

  // auto-resize
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';};

  saveBtn.onclick=()=>{
    setMemo(store.id,sec,y,m,ta.value);
    save();
    saveBtn.textContent='✓ 저장됨';
    saveBtn.className='memo-save-btn saved';
    setTimeout(()=>{saveBtn.textContent='저장';saveBtn.className='memo-save-btn';},1500);
  };
  parent.appendChild(wrap);
}

function renderEmpSection(parent,store){
  const emps=getEmps(store.id,APP.activeSection);
  const sec=document.createElement('div');sec.className='emp-section';
  const toolbar=document.createElement('div');toolbar.className='emp-toolbar';
  if(APP._toggles===undefined)APP._toggles={};
  const empToggleKey='emp_open_'+APP.activeStoreId+'_'+APP.activeSection;
  const isEmpOpen=!!APP._toggles[empToggleKey];
  const h3=document.createElement('div');
  h3.style.cssText='display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%;user-select:none';
  h3.innerHTML=`<span style="font-size:14px;font-weight:500">${APP.activeSection} 직원 (${emps.length}명)</span><span style="font-size:11px;color:var(--color-text-secondary)">${isEmpOpen?'▲':'▼'}</span>`;
  h3.onclick=()=>{APP._toggles[empToggleKey]=!APP._toggles[empToggleKey];render();};
  toolbar.appendChild(h3);sec.appendChild(toolbar);
  const empBody=document.createElement('div');
  empBody.style.display=isEmpOpen?'block':'none';

  if(emps.length===0){
    const msg=document.createElement('div');msg.className='empty-msg';msg.textContent='등록된 직원이 없습니다.';empBody.appendChild(msg);
  } else {
    emps.forEach((e,idx)=>{
      const {gen,used}=calcAnnual(e,store.id,APP.activeSection,APP.calYear,APP.calMonth);
      const rem=Math.max(0,gen-used);
      const card=document.createElement('div');card.className='emp-card';

      // Row1: 이름 + 직급 + 고용형태
      const row1=document.createElement('div');row1.className='emp-row1';
      const title=document.createElement('div');title.className='emp-title';
      const nm=document.createElement('span');nm.className='emp-name';nm.textContent=e.name;

      title.appendChild(nm);
      if(e.position){const pos=document.createElement('span');pos.className='emp-position';pos.textContent=e.position;title.appendChild(pos);}
      const badge=document.createElement('span');badge.className=`emp-badge ${e.type==='정규직'?'full':'part'}`;badge.textContent=e.type;
      row1.appendChild(title);row1.appendChild(badge);card.appendChild(row1);

      // Row2: 입사일만 (간소화)
      const row2=document.createElement('div');row2.className='emp-row2';
      const joinIt=document.createElement('div');joinIt.className='emp-info-item';
      joinIt.innerHTML=`입사일 <span>${e.joinDate||'-'}</span>`;row2.appendChild(joinIt);
      if(e.birthday){const bdIt=document.createElement('div');bdIt.className='emp-info-item';bdIt.innerHTML=`생일 <span>${e.birthday}</span>`;row2.appendChild(bdIt);}
      card.appendChild(row2);

      // Row3: 연차 칩들 + 삭제
      const row3=document.createElement('div');row3.className='emp-row3';
      [{l:'연차발생',v:gen+'일',edit:'gen'},{l:'사용수',v:used+'일',c:used>0?'#A32D2D':'',edit:'used'},{l:'잔여',v:rem+'일',c:rem>5?'#27500A':rem>0?'#633806':'#5F5E5A'}].forEach(({l,v,c,edit})=>{
        const chip=document.createElement('div');chip.className='annual-chip';
        chip.innerHTML=`<div class="ac-label">${l}</div><div class="ac-val"${c?` style="color:${c}"`:''} >${v}</div>`;
        if(edit){
          chip.className+=' editable';
          const editBtn=document.createElement('button');editBtn.className='btn-annual-edit';editBtn.type='button';editBtn.title=`${l} 수정`;editBtn.textContent='✎';
          editBtn.onclick=()=>{APP.modal={type:'editAnnual',target:edit,storeId:store.id,section:APP.activeSection,empIndex:idx,form:{annualManual:e.annualManual??gen,annualUsedManual:e.annualUsedManual??used}};render()};
          chip.appendChild(editBtn);
        }
        row3.appendChild(chip);
      });
      const delBtn=document.createElement('button');delBtn.className='btn-del';delBtn.textContent='삭제';
      delBtn.onclick=()=>{if(!confirm(`"${e.name}" 삭제?`))return;emps.splice(idx,1);setEmps(store.id,APP.activeSection,emps);save();render()};
      row3.appendChild(delBtn);
      card.appendChild(row3);
      empBody.appendChild(card);
    });
  }

  sec.appendChild(empBody);

  // + 추가 버튼 → 마지막 직원 아래에 위치
  const addBtn=document.createElement('button');addBtn.className='btn-add';addBtn.style.cssText='width:100%;margin-top:10px';addBtn.textContent='+ 직원 추가';
  addBtn.onclick=()=>{APP.modal={type:'addEmp',storeId:store.id,section:APP.activeSection,form:{name:'',position:'',birthday:'',joinDate:'',type:'정규직'}};render()};
  sec.appendChild(addBtn);

  const note=document.createElement('p');note.className='emp-note';
  note.textContent='매장: 월 8회 휴무 | 8시간 근무, 1시간 휴게 | 연차: 1년 만근 후 15개 발생 | 반차=0.5일, 반반차=0.25일 차감';
  sec.appendChild(note);
  parent.appendChild(sec);
}

function renderModal(root){
  const m=APP.modal;
  if(!m)return;
  const wrap=document.createElement('div');wrap.className='overlay-wrap';
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.onclick=(e)=>{if(e.target===bg){APP.modal=null;save();render()}};

  const modal=document.createElement('div');modal.className='modal';
  const handle=document.createElement('div');handle.className='modal-handle';modal.appendChild(handle);

  if(m.type==='day'){
    const sched=getSched(m.storeId,m.section,m.y,m.m);
    if(!sched[m.dayKey])sched[m.dayKey]={};
    const dayData=sched[m.dayKey];
    const emps=getEmps(m.storeId,m.section);
    const dow=new Date(m.y,m.m,m.d).getDay();

    const h3=document.createElement('h3');
    h3.textContent=`${m.m+1}월 ${m.d}일 (${DOWS[dow]}) 근무 입력`;
    modal.appendChild(h3);

    // ── 현재 배정 요약 카드 ────────────────────────────────
    const summaryCard=document.createElement('div');
    summaryCard.style.cssText='background:#FBF6EF;border:1px solid #E6D8CA;border-radius:12px;padding:12px;margin-bottom:12px';
    const summaryTitle=document.createElement('div');
    summaryTitle.style.cssText='font-size:13px;font-weight:700;color:#4B4037;margin-bottom:8px;letter-spacing:0';
    summaryTitle.textContent='현재 배정 현황';
    summaryCard.appendChild(summaryTitle);

    const SHIFT_GROUPS=[
      {key:'오픈',cls:'open',label:'오픈'},
      {key:'미들',cls:'mid',label:'미들'},
      {key:'마감',cls:'close',label:'마감'},
      {key:'휴무',cls:'off',label:'휴무'},
      {key:'연차',cls:'annual',label:'연차'},
      {key:'오전반차',cls:'half_am',label:'오전반차'},
      {key:'오후반차',cls:'half_pm',label:'오후반차'},
      {key:'반반차',cls:'quarter',label:'반반차'},
    ];

    // build summary rows – only groups that have people
    const byShiftSummary={};
    Object.entries(dayData).forEach(([name,sh])=>{
      if(!byShiftSummary[sh])byShiftSummary[sh]=[];
      byShiftSummary[sh].push(name);
    });

    let hasAnyone=false;
    SHIFT_GROUPS.forEach(sg=>{
      const names=byShiftSummary[sg.key]||[];
      if(!names.length)return;
      hasAnyone=true;
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:flex-start;gap:6px;margin-bottom:5px';
      const lbl=document.createElement('span');
      lbl.style.cssText=`font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;background:var(--dbadge-${sg.cls}-bg,#eee);color:var(--color-text-primary)`;
      // inline colors
      const bgMap={open:'#EAF3DE',mid:'#E1F5EE',close:'#EEEDFE',off:'#FAECE7',annual:'#FAEEDA',half_am:'#F0E8F8',half_pm:'#EAE1F8',quarter:'#F5EDF8'};
      const tcMap={open:'#27500A',mid:'#085041',close:'#3C3489',off:'#712B13',annual:'#633806',half_am:'#5B2E91',half_pm:'#4A2080',quarter:'#6B35A0'};
      lbl.style.background=bgMap[sg.cls]||'#eee';
      lbl.style.color=tcMap[sg.cls]||'#333';
      lbl.textContent=sg.label;
      row.appendChild(lbl);
      const nameSpan=document.createElement('span');
      nameSpan.style.cssText='font-size:13px;color:var(--color-text-primary);line-height:1.6';
      nameSpan.textContent=names.join(', ');
      row.appendChild(nameSpan);
      summaryCard.appendChild(row);
    });
    if(!hasAnyone){
      const none=document.createElement('div');
      none.style.cssText='font-size:13px;color:var(--color-text-secondary)';
      none.textContent='아직 배정된 직원이 없습니다';
      summaryCard.appendChild(none);
    }
    modal.appendChild(summaryCard);

    // ── 근무 선택 섹션 ────────────────────────────────────
    // 이번 달 각 직원의 오픈/미들/마감/휴무 누적 횟수 계산 (이 날 제외)
    const monthSched=getSched(m.storeId,m.section,m.y,m.m);
    const empOpenCount={},empMidCount={},empCloseCount={},empOffCount={};
    emps.forEach(e=>{empOpenCount[e.name]=0;empMidCount[e.name]=0;empCloseCount[e.name]=0;empOffCount[e.name]=0});
    Object.entries(monthSched).forEach(([dk,dayD])=>{
      if(dk===m.dayKey)return; // 오늘 제외
      Object.entries(dayD).forEach(([name,sh])=>{
        if(sh==='오픈')empOpenCount[name]=(empOpenCount[name]||0)+1;
        else if(sh==='미들')empMidCount[name]=(empMidCount[name]||0)+1;
        else if(sh==='마감')empCloseCount[name]=(empCloseCount[name]||0)+1;
        else if(sh==='휴무')empOffCount[name]=(empOffCount[name]||0)+1;
      });
    });

    [
      {label:'☀️ 오픈 근무자',key:'오픈',cls:'sel-open',open:true},
      {label:'🌤 미들 근무자',key:'미들',cls:'sel-mid',open:true},
      {label:'🌙 마감 근무자',key:'마감',cls:'sel-close',open:true},
      {label:'🏖 휴무자',key:'휴무',cls:'sel-off',open:true},
      {label:'📅 연차 사용자',key:'연차',cls:'sel-annual',open:false},
      {label:'🌅 오전 반차',key:'오전반차',cls:'sel-half_am',open:false},
      {label:'🌆 오후 반차',key:'오후반차',cls:'sel-half_pm',open:false},
      {label:'⏱ 반반차 (¼일)',key:'반반차',cls:'sel-quarter',open:false},
    ].forEach(sg=>{
      const sec=document.createElement('div');sec.className='shift-section';
      const titleRow=document.createElement('div');titleRow.className='shift-title';
      titleRow.style.cssText='cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none';
      const titleText=document.createElement('span');titleText.textContent=sg.label;titleRow.appendChild(titleText);
      const arrow=document.createElement('span');arrow.textContent=sg.open?'▲':'▼';arrow.style.cssText='font-size:10px;opacity:.5';titleRow.appendChild(arrow);
      sec.appendChild(titleRow);
      const btnGrid=document.createElement('div');btnGrid.className='emp-btn-grid';
      if(!sg.open)btnGrid.style.display='none';
      let isOpen=sg.open;
      titleRow.onclick=()=>{isOpen=!isOpen;btnGrid.style.display=isOpen?'flex':'none';arrow.textContent=isOpen?'▲':'▼';};
      emps.forEach(e=>{
        const cur=dayData[e.name];
        const b=document.createElement('button');
        b.className='emp-pick-btn'+(cur===sg.key?' '+sg.cls:'');
        // 이름 + 해당 근무 누적 횟수 표시
        let countThisShift=0;
        if(sg.key==='오픈')countThisShift=empOpenCount[e.name]||0;
        else if(sg.key==='미들')countThisShift=empMidCount[e.name]||0;
        else if(sg.key==='마감')countThisShift=empCloseCount[e.name]||0;
        else if(sg.key==='휴무')countThisShift=empOffCount[e.name]||0;
        // 선택 시 +1 예상
        // 휴무만 누적 카운트 표시, 나머지는 이름만
        if(sg.key==='휴무'){
          const preview=cur===sg.key?(countThisShift+1):(countThisShift+1);
          const displayCount=cur===sg.key?(countThisShift+1):(countThisShift+1);
          b.innerHTML=`${e.name}<sup style="font-size:9px;margin-left:2px;opacity:.7">${displayCount}</sup>`;
        } else {
          b.textContent=e.name;
        }
        b.onclick=()=>{
          dayData[e.name]=dayData[e.name]===sg.key?undefined:sg.key;
          if(dayData[e.name]===undefined)delete dayData[e.name];
          save();APP.modal={...m};render();
        };
        // POS 담당자 토글 버튼 (오픈, 마감에만)
        if(sg.key==='오픈'||sg.key==='마감'){
          const wrapper=document.createElement('div');wrapper.style.cssText='display:inline-flex;align-items:center;gap:2px;flex-shrink:0';
          wrapper.appendChild(b);
          const posBtn=document.createElement('button');
          posBtn.type='button';
          posBtn.title='포스 담당자로 지정';
          const posKey='__pos__'+e.name;
          const isCurrentPos=!!(dayData[posKey]);
          posBtn.style.cssText=`padding:5px 7px;font-size:11px;font-weight:700;border:1px solid ${isCurrentPos?'#C8844A':'#D8C9BA'};border-radius:14px;cursor:pointer;background:${isCurrentPos?'#F5EDE3':'transparent'};color:${isCurrentPos?'#7D4A1A':'var(--color-text-secondary)'};min-height:36px;white-space:nowrap`;
          posBtn.textContent=isCurrentPos?'P ✓':'P';
          posBtn.onclick=(ev)=>{
            ev.stopPropagation();
            if(dayData[posKey])delete dayData[posKey];else dayData[posKey]=true;
            save();APP.modal={...m};render();
          };
          wrapper.appendChild(posBtn);
          btnGrid.appendChild(wrapper);
        } else {
          btnGrid.appendChild(b);
        }
      });
      sec.appendChild(btnGrid);modal.appendChild(sec);
    });

    // ── 연장 근무 입력 섹션 ──────────────────────────────
    const otSec=document.createElement('div');otSec.className='shift-section';
    const otTitle=document.createElement('div');otTitle.className='shift-title';
    otTitle.style.cssText='cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none';
    const otTitleText=document.createElement('span');otTitleText.textContent='⏱ 연장 근무 시간';otTitle.appendChild(otTitleText);
    const otArrow=document.createElement('span');otArrow.textContent='▼';otArrow.style.cssText='font-size:10px;opacity:.5';otTitle.appendChild(otArrow);
    otSec.appendChild(otTitle);
    const otBody=document.createElement('div');otBody.style.display='none';
    let otOpen=false;
    otTitle.onclick=()=>{otOpen=!otOpen;otBody.style.display=otOpen?'block':'none';otArrow.textContent=otOpen?'▲':'▼';};
    // 근무자만 표시 (오픈/미들/마감 배정된 직원)
    const workShifts=['오픈','미들','마감'];
    const workerEmps=emps.filter(e=>workShifts.includes(dayData[e.name]));
    if(workerEmps.length===0){
      const noWorker=document.createElement('div');noWorker.style.cssText='font-size:12px;color:var(--color-text-secondary);padding:6px 2px';
      noWorker.textContent='오픈·미들·마감 근무자를 먼저 배정해주세요.';otBody.appendChild(noWorker);
    } else {
      workerEmps.forEach(e=>{
        const curOt=getOT(dayData,e.name);
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px';
        const nameLbl=document.createElement('span');
        nameLbl.style.cssText='font-size:13px;font-weight:600;min-width:60px;color:var(--color-text-primary)';
        nameLbl.textContent=e.name;
        row.appendChild(nameLbl);
        // - 버튼
        const minusBtn=document.createElement('button');
        minusBtn.type='button';
        minusBtn.textContent='−';
        minusBtn.style.cssText='width:32px;height:32px;border:1px solid #D8C9BA;border-radius:8px;background:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center';
        // 시간 표시
        const otDisp=document.createElement('span');
        otDisp.style.cssText='min-width:44px;text-align:center;font-size:14px;font-weight:600;color:#185FA5';
        otDisp.textContent=curOt>0?`+${curOt}h`:'0h';
        // + 버튼
        const plusBtn=document.createElement('button');
        plusBtn.type='button';
        plusBtn.textContent='+';
        plusBtn.style.cssText='width:32px;height:32px;border:1px solid #D8C9BA;border-radius:8px;background:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center';
        // 사유 입력
        const reasonInp=document.createElement('input');
        reasonInp.type='text';
        reasonInp.placeholder='사유 (선택)';
        reasonInp.value=getOTR(dayData,e.name);
        reasonInp.style.cssText='flex:1;min-width:0;padding:6px 8px;font-size:12px;border:1px solid #D8C9BA;border-radius:8px;background:#fff;color:var(--color-text-primary);height:32px';
        reasonInp.oninput=()=>{
          const v=reasonInp.value.trim();
          if(v)dayData[otrKey(e.name)]=v;
          else delete dayData[otrKey(e.name)];
          save();
        };
        // 현재 값 추적
        let val=curOt;
        const update=()=>{
          otDisp.textContent=val>0?`+${val}h`:'0h';
          otDisp.style.color=val>0?'#185FA5':'var(--color-text-secondary)';
          if(val>0)dayData[otKey(e.name)]=val;
          else delete dayData[otKey(e.name)];
          save();
        };
        minusBtn.onclick=()=>{if(val>=0.5){val=Math.round((val-0.5)*10)/10;update();}};
        plusBtn.onclick=()=>{val=Math.round((val+0.5)*10)/10;update();};
        row.appendChild(minusBtn);row.appendChild(otDisp);row.appendChild(plusBtn);row.appendChild(reasonInp);
        otBody.appendChild(row);
      });
    }
    otSec.appendChild(otBody);modal.appendChild(otSec);

    const closeBtn=document.createElement('button');closeBtn.className='close-btn';closeBtn.textContent='닫기';
    closeBtn.onclick=()=>{APP.modal=null;save();render()};modal.appendChild(closeBtn);
  } else if(m.type==='editAnnual'){
    const emps=getEmps(m.storeId,m.section);
    const emp=emps[m.empIndex];
    if(!emp){APP.modal=null;render();return;}
    const current=calcAnnual(emp,m.storeId,m.section,APP.calYear,APP.calMonth);
    const isUsed=m.target==='used';
    const h3=document.createElement('h3');h3.textContent=`${isUsed?'사용수':'연차발생'} 수정 — ${emp.name}`;modal.appendChild(h3);
    modal.innerHTML+=`<div class="form-card primary">
      <div class="form-card-title">${isUsed?'사용 연차 수기 입력':'연차 발생일 수기 입력'}</div>
      <div class="form-row"><label>${isUsed?'사용수':'연차발생'}</label><input id="fi-annual" type="number" inputmode="decimal" min="0" step="0.5" placeholder="연차 일수" value="${isUsed?(m.form.annualUsedManual??current.used):(m.form.annualManual??current.gen)}"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="mb-reset">자동계산</button>
      <button class="btn-confirm" id="mb-save">저장</button>
    </div>`;
    modal.querySelector('#mb-reset').onclick=()=>{
      if(isUsed)delete emp.annualUsedManual;
      else delete emp.annualManual;
      setEmps(m.storeId,m.section,emps);
      APP.modal=null;save();render();
    };
    modal.querySelector('#mb-save').onclick=()=>{
      const raw=modal.querySelector('#fi-annual').value.trim();
      const val=Number(raw);
      if(raw===''||!Number.isFinite(val)||val<0){alert('연차 일수를 입력해주세요.');return;}
      if(isUsed)emp.annualUsedManual=Math.round(val*100)/100;
      else emp.annualManual=Math.round(val*100)/100;
      setEmps(m.storeId,m.section,emps);
      APP.modal=null;save();render();
    };
  } else if(m.type==='addEmp'){
    const h3=document.createElement('h3');h3.textContent=`직원 추가 — ${m.section}`;modal.appendChild(h3);
    modal.innerHTML+=`<div class="form-card primary">
      <div class="form-card-title">기본 정보</div>
      <div class="form-row"><label>직원명 *</label><input id="fi-name" type="text" placeholder="이름" value="${m.form.name}"></div>
      <div class="form-row"><label>직급</label><input id="fi-position" type="text" placeholder="예: 매니저, 스태프" value="${m.form.position||''}"></div>
    </div>
    <div class="form-card">
      <div class="form-card-title">날짜 정보</div>
      ${dateFields('fi-bday','생년월일',m.form.birthday)}
      ${dateFields('fi-join','입사일',m.form.joinDate,true)}
    </div>
    <div class="form-card">
      <div class="form-card-title">근무 정보</div>
      <div class="form-row"><label>고용형태</label><select id="fi-type">
        <option value="정규직" ${m.form.type==='정규직'?'selected':''}>정규직</option>
        <option value="일용직" ${m.form.type==='일용직'?'selected':''}>일용직</option>
      </select></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="mb-c">취소</button>
      <button class="btn-confirm" id="mb-a">추가</button>
    </div>`;
    modal.querySelector('#fi-name').oninput=(e)=>{m.form.name=e.target.value};
    modal.querySelector('#fi-position').oninput=(e)=>{m.form.position=e.target.value};
    wireDateFields('fi-bday',modal,(value)=>{m.form.birthday=value});
    wireDateFields('fi-join',modal,(value)=>{m.form.joinDate=value});
    modal.querySelector('#fi-type').onchange=(e)=>{m.form.type=e.target.value};
    modal.querySelector('#mb-c').onclick=()=>{APP.modal=null;render()};
    modal.querySelector('#mb-a').onclick=()=>{
      const name=modal.querySelector('#fi-name').value.trim();
      const position=modal.querySelector('#fi-position').value.trim();
      const joinDate=joinDateValue('fi-join',modal);
      const birthday=joinDateValue('fi-bday',modal);
      const type=modal.querySelector('#fi-type').value;
      if(!name){alert('직원명을 입력해주세요.');return;}
      if(!joinDate){alert('입사일을 입력해주세요.');return;}
      const emps=getEmps(m.storeId,m.section);
      emps.push({name,position,birthday,joinDate,type});
      setEmps(m.storeId,m.section,emps);
      APP.modal=null;save();render();
    };
  } else if(m.type==='editStoreName'){
    const store=APP.stores.find(s=>s.id===m.storeId);
    if(!store){APP.modal=null;render();return;}
    const h3=document.createElement('h3');h3.textContent='점포명 수정';modal.appendChild(h3);
    modal.innerHTML+=`<div class="form-card primary">
      <div class="form-card-title">점포 이름</div>
      <div class="form-row"><label>점포명</label><input id="fi-sname" type="text" placeholder="점포명 입력" value="${store.name}"></div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="mb-c">취소</button>
      <button class="btn-confirm" id="mb-s">저장</button>
    </div>`;
    const inp=modal.querySelector('#fi-sname');
    setTimeout(()=>{inp.focus();inp.select();},0);
    const doSave=()=>{
      const name=inp.value.trim();
      if(!name){alert('점포명을 입력해주세요.');return;}
      store.name=name;
      APP.modal=null;save();render();
    };
    inp.onkeydown=(e)=>{if(e.key==='Enter')doSave();};
    modal.querySelector('#mb-c').onclick=()=>{APP.modal=null;render();};
    modal.querySelector('#mb-s').onclick=doSave;
  }

  bg.appendChild(modal);wrap.appendChild(bg);root.appendChild(wrap);
}


function exportCalendarImage(store){
  const calEl=document.querySelector('.cal-wrap');
  if(!calEl){alert('달력을 찾을 수 없습니다.');return;}
  const storeName=store?store.name:'';
  const sec=APP.activeSection||'';
  const y=APP.calYear,m=APP.calMonth+1;
  const fileName=`${storeName}_${sec}_${y}년${m}월_달력.png`;

  const imgBtn=document.querySelector('.btn-imgdl');
  const excelBtn=document.querySelector('.btn-excel');
  if(imgBtn)imgBtn.style.display='none';
  if(excelBtn)excelBtn.style.display='none';

  const headerEl=calEl.querySelector('.cal-header h3');
  const origTitle=headerEl?headerEl.textContent:'';
  if(headerEl)headerEl.textContent=`${storeName} ${sec} | ${y}년 ${m}월 달력`;

  html2canvas(calEl,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false}).then(canvas=>{
    if(headerEl)headerEl.textContent=origTitle;
    if(imgBtn)imgBtn.style.display='';
    if(excelBtn)excelBtn.style.display='';
    const link=document.createElement('a');
    link.download=fileName;
    link.href=canvas.toDataURL('image/png');
    link.click();
  }).catch(err=>{
    if(headerEl)headerEl.textContent=origTitle;
    if(imgBtn)imgBtn.style.display='';
    if(excelBtn)excelBtn.style.display='';
    alert('이미지 저장 실패: '+err.message);
  });
}

function exportExcel(){
  const store=getStore();
  if(!store){alert('점포를 선택해주세요.');return;}
  const y=APP.calYear, m=APP.calMonth;
  const monthLabel=`${y}년 ${m+1}월`;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const DOWS_KR=['일','월','화','수','목','금','토'];

  const wb=XLSX.utils.book_new();

  store.sections.forEach(sec=>{
    const emps=getEmps(store.id,sec);
    const sched=getSched(store.id,sec,y,m);

    // Header row: 날짜 columns
    const dateHeaders=[];
    for(let d=1;d<=daysInMonth;d++){
      const dow=new Date(y,m,d).getDay();
      dateHeaders.push(`${d}일(${DOWS_KR[dow]})`);
    }
    const headers=['직원명','고용형태','입사일',...dateHeaders,'근무일수','휴무수','연차사용','반차수','연장(h)','잔여연차'];
    const rows=[headers];

    emps.forEach(e=>{
      const row=[e.name, e.type, e.joinDate||''];
      let workCnt=0,offCnt=0,annualUsed=0,halfCnt=0,otTotal=0;
      for(let d=1;d<=daysInMonth;d++){
        const dk=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayD=sched[dk]||{};
        const sh=dayD[e.name]||'';
        const ot=getOT(dayD,e.name);
        const LABELS={오픈:'오픈',미들:'미들',마감:'마감',휴무:'휴무',연차:'연차',오전반차:'오전반차',오후반차:'오후반차',반반차:'반반차'};
        const shLabel=LABELS[sh]||(sh?sh:'');
        const otReason=ot>0?getOTR(dayD,e.name):'';
        row.push(ot>0?`${shLabel||''}(+${ot}h${otReason?'/'+otReason:''})`:shLabel);
        if(['오픈','미들','마감'].includes(sh))workCnt++;
        else if(sh==='휴무')offCnt++;
        else if(sh==='연차')annualUsed++;
        else if(['오전반차','오후반차','반반차'].includes(sh))halfCnt++;
        otTotal=Math.round((otTotal+ot)*10)/10;
      }
      const {gen,used}=calcAnnual(e,store.id,sec,y,m);
      const rem=Math.max(0,gen-used);
      row.push(workCnt,offCnt,used,halfCnt,otTotal,rem);
      rows.push(row);
    });

    // Summary row
    const sumRow=['합계','',''];
    for(let d=1;d<=daysInMonth;d++){
      const dk=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayData=sched[dk]||{};
      const working=emps.filter(e=>['오픈','미들','마감'].includes(dayData[e.name])).length;
      sumRow.push(`근무${working}명`);
    }
    sumRow.push('','','','','','');
    rows.push(sumRow);

    const ws=XLSX.utils.aoa_to_sheet(rows);

    // Column widths
    ws['!cols']=[{wch:10},{wch:8},{wch:12},...Array(daysInMonth).fill({wch:9}),{wch:8},{wch:7},{wch:8},{wch:7},{wch:8},{wch:8}];

    // Freeze first row + first col
    ws['!freeze']={xSplit:3,ySplit:1,topLeftCell:'D2',activePane:'bottomRight'};

    XLSX.utils.book_append_sheet(wb,ws,sec.slice(0,31));
  });

  // Summary sheet across all stores
  const sumRows=[['점포','구역','직원수','총근무일','총휴무','총연차','총반차','총연장(h)']];
  APP.stores.forEach(st=>{
    st.sections.forEach(sec=>{
      const emps=getEmps(st.id,sec);
      const sched=getSched(st.id,sec,y,m);
      const daysInMonth=new Date(y,m+1,0).getDate();
      let totalWork=0,totalOff=0,totalAnn=0,totalHalf=0,totalOt=0;
      emps.forEach(e=>{
        for(let d=1;d<=daysInMonth;d++){
          const dk=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const dayD=sched[dk]||{};
          const sh=dayD[e.name]||'';
          if(['오픈','미들','마감'].includes(sh))totalWork++;
          else if(sh==='휴무')totalOff++;
          else if(sh==='연차')totalAnn++;
          else if(['오전반차','오후반차','반반차'].includes(sh))totalHalf++;
          totalOt=Math.round((totalOt+getOT(dayD,e.name))*10)/10;
        }
      });
      sumRows.push([st.name,sec,emps.length,totalWork,totalOff,totalAnn,totalHalf,totalOt]);
    });
  });
  const sumWs=XLSX.utils.aoa_to_sheet(sumRows);
  sumWs['!cols']=[{wch:12},{wch:8},{wch:8},{wch:10},{wch:8},{wch:8},{wch:8},{wch:10}];
  XLSX.utils.book_append_sheet(wb,sumWs,'전체요약');

  const fileName=`${store.name}_${y}년${m+1}월_스케줄.xlsx`;
  XLSX.writeFile(wb,fileName);
}

render();
</script>
